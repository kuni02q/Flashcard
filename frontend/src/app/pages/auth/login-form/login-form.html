<form (ngSubmit)="login()">
  <div class="mb-3">
    <label class="form-label"> Email vagy felhasználónév </label>

    <input
      class="form-control"
      [class.is-invalid]="loginError"
      type="text"
      [(ngModel)]="identifier"
      (ngModelChange)="clearError()"
      name="identifier"
    />
  </div>

  <div class="mb-4">
    <label class="form-label"> Jelszó </label>

    <input
      class="form-control"
      [class.is-invalid]="loginError"
      type="password"
      [(ngModel)]="password"
      (ngModelChange)="clearError()"
      name="password"
    />
  </div>

  @if (loginError) {
    <div class="alert alert-danger">
      Sikertelen bejelentkezés! Ellenőrizd az email címet/felhasználónevet és a jelszót.
    </div>
  }

  <button class="btn btn-primary w-100" type="submit">Bejelentkezés</button>
</form>
