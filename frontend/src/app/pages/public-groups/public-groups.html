<div class="container mt-4">
  <div class="row mb-4 align-items-center g-2">
    <div class="col-md">
      <h1 class="h3 fw-bold mb-0">
        Publikus csoportok
      </h1>
    </div>

    <div class="col-md">
      <input
        class="form-control"
        placeholder="Csoport keresése..."
        [(ngModel)]="searchTerm"
      />
    </div>

    <div class="col-md-auto">
      <select class="form-select" [(ngModel)]="sortBy">
        <option value="name">Név szerint</option>
        <option value="wordCount">Szópárok száma</option>
        <option value="popular">Legnépszerűbb</option>
      </select>
    </div>
  </div>

  <div class="row g-4">
    @for (group of filteredGroups; track group.id) {
      <div class="col-md-6 col-lg-4">
        <app-public-group-card
          [group]="group"
          (open)="openGroup($event)"
        ></app-public-group-card>
      </div>
    }

    @if (filteredGroups.length === 0) {
      <div class="col-12">
        <div class="text-center text-muted py-5">
          <i class="bi bi-search fs-1"></i>
          <p class="mt-3 mb-0">Nincs megjeleníthető publikus csoport.</p>
        </div>
      </div>
    }
  </div>
</div>
