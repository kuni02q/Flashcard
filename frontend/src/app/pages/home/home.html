<div class="container mt-4">
  <div class="row mb-4 align-items-center">

    <div class="col-md-auto">
      <button class="btn btn-primary" (click)="openCreateModal()">
        <i class="bi bi-plus-lg"></i>

        Új csoport
      </button>
    </div>

    <div class="col-md">
      <input class="form-control" placeholder="Csoport keresése..." />
    </div>

    <div class="col-md-auto">
      <select class="form-select">
        <option>Név szerint</option>

        <option>Legutóbb használt</option>

        <option>Szópárok száma</option>
      </select>
    </div>


  </div>



  <div class="row g-4">
    @for (group of groups; track group.id) {
      <div class="col-md-4">
        <app-group-card [group]="group" (delete)="deleteGroup($event)"></app-group-card>
      </div>
    }
  </div>
</div>
