<div class="card shadow-sm h-100 group-card" (click)="openGroup()">
  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between gap-2 mb-2">
      <h3 class="fw-bold mb-0">{{ group.name }}</h3>

      <span class="badge text-bg-success align-self-start">
        <i class="bi bi-globe2 me-1"></i>
        Nyilvános
      </span>
    </div>

    <p class="text-muted">
      {{ group.description || 'Nincs leírás.' }}
    </p>

    <p class="mb-2">
      <i class="bi bi-person me-1"></i>
      Készítő: {{ group.ownerName }}
    </p>

    <p class="mb-2">
      <i class="bi bi-translate me-1"></i>
      {{ group.sourceLanguage }} - {{ group.targetLanguage }}
    </p>

    <p class="mb-3">
      <i class="bi bi-book me-1"></i>
      {{ group.wordCount }} szópár
    </p>

    <div class="mt-auto text-muted small d-flex gap-3">
      <span>
        <i class="bi bi-eye me-1"></i>
        {{ group.viewCount }}
      </span>

      <span>
        <i class="bi bi-collection-plus me-1"></i>
        {{ group.addCount }}
      </span>
    </div>
  </div>
</div>
