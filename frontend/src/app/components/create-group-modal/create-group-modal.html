<div class="modal-header">
  <h3 class="modal-title fs-5">Új csoport létrehozása</h3>
  <button type="button" class="btn-close" aria-label="Bezárás" (click)="cancel()"></button>
</div>

<div class="modal-body">
  <label class="form-label" for="group-name">Név</label>
  <input #nameInput id="group-name" class="form-control mb-3" [(ngModel)]="name" />

  <label class="form-label" for="group-description">Leírás</label>
  <textarea id="group-description" class="form-control mb-3" [(ngModel)]="description"></textarea>

  <label class="form-label">Forrás nyelv</label>
  <div ngbDropdown #sourceDropdown="ngbDropdown" class="d-block mb-3">
    <button type="button" class="btn btn-outline-secondary w-100 text-start" ngbDropdownToggle>
      {{ sourceSearch || 'Nyelv kiválasztása' }}
    </button>
    <div ngbDropdownMenu class="w-100 p-2">
      <input
        class="form-control mb-2"
        placeholder="Keresés..."
        [(ngModel)]="sourceSearch"
        (click)="$event.stopPropagation()"
      />
      @for (language of filteredSourceLanguages; track language.id) {
        <button
          type="button"
          ngbDropdownItem
          (click)="selectSourceLanguage(language); sourceDropdown.close()"
        >
          {{ language.name }}
        </button>
      }
    </div>
  </div>

  <label class="form-label">Cél nyelv</label>
  <div ngbDropdown #targetDropdown="ngbDropdown" class="d-block">
    <button type="button" class="btn btn-outline-secondary w-100 text-start" ngbDropdownToggle>
      {{ targetSearch || 'Nyelv kiválasztása' }}
    </button>
    <div ngbDropdownMenu class="w-100 p-2">
      <input
        class="form-control mb-2"
        placeholder="Keresés..."
        [(ngModel)]="targetSearch"
        (click)="$event.stopPropagation()"
      />
      @for (language of filteredTargetLanguages; track language.id) {
        <button
          type="button"
          ngbDropdownItem
          (click)="selectTargetLanguage(language); targetDropdown.close()"
        >
          {{ language.name }}
        </button>
      }
    </div>
  </div>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="cancel()">Mégse</button>
  <button type="button" class="btn btn-primary" (click)="create()">Létrehozás</button>
</div>
