<div class="modal-backdrop" (click)="$event.stopPropagation()">


  <div class="modal-box bg-body text-body" (click)="$event.stopPropagation()">

    <h3>
      Új csoport létrehozása
    </h3>

    <label class="form-label">
      Név
    </label>

    <input
      class="form-control mb-3"
      [(ngModel)]="name"
    >

    <label class="form-label">
      Leírás
    </label>


    <textarea
      class="form-control mb-3"
      [(ngModel)]="description">
    </textarea>



    <label class="form-label">
      Forrás nyelv
    </label>


    <div class="position-relative" (click)="stopPropagation($event)">

      <input
        class="form-control"
        placeholder="Keresés..."
        [(ngModel)]="sourceSearch"
        (focus)="openSourceDropdown()"
      >

      @if(sourceDropdownOpen){

        <div class="language-list list-group">

          @for(language of filteredSourceLanguages; track language.id){


            <button type="button" class="language-item list-group-item list-group-item-action" (click)="selectSourceLanguage(language)">
              {{language.name}}
            </button>

          }

        </div>

      }

    </div>



    <label class="form-label mt-3">
      Cél nyelv
    </label>


    <div class="position-relative" (click)="stopPropagation($event)">

      <input
        class="form-control"
        placeholder="Keresés..."
        [(ngModel)]="targetSearch"
        (focus)="openTargetDropdown()"
      >

      @if(targetDropdownOpen){

        <div class="language-list list-group">

          @for(language of filteredTargetLanguages; track language.id){

            <button type="button" class="language-item list-group-item list-group-item-action" (click)="selectTargetLanguage(language)">
              {{language.name}}
            </button>

          }

        </div>

      }

    </div>



    <div class="text-end mt-4">

      <button class="btn btn-secondary me-2" (click)="cancel()">
        Mégse
      </button>

      <button class="btn btn-primary" (click)="create()">
        Létrehozás
      </button>

    </div>


  </div>

</div>
